- name: Install patches and updates on Windows Server 2025
  hosts: windows
  tasks:
    - name: Ensure PowerShell is available
      ansible.builtin.shell: "Get-Command PowerShell -ErrorAction SilentlyContinue"
      register: ps_available

    - name: Navigate to the directory where patches and updates are downloaded
      ansible.builtin.shell: "cd C:\\path\\to\\patches"
      when: ps_available.rc == 0

    - name: Install patches using msiexec
      ansible.builtin.shell: "msiexec /i <patch_file>"
      when: ps_available.rc == 0

    - name: Install updates using Install-Update
      ansible.builtin.win_shell: "Install-Update -FilePath <patch_file>"
      when: ps_available.rc == 0