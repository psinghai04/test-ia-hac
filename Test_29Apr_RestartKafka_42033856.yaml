- name: Install patches and updates on Windows Servers 2025
  hosts: windows
  become: yes
  tasks:
    - name: Navigate to the directory where patches and updates are downloaded
      ansible.windows.win_shell:
        cmd: cd C:\path\to\patches
      register: patch_directory

    - name: Install patches and updates
      ansible.windows.win_shell:
        cmd: msiexec /i <patch_file>
      args:
        in: "{{ patch_directory.stdout }}"
      when: patch_directory.stdout != ""