- name: Install patches and updates on Windows Server 2025
  hosts: windows
  become: yes
  tasks:
    - name: Check if the patch or update file exists
      ansible.builtin.stat:
        path: C:\path\to\your\patch_or_update_file
      register: file_exists

    - name: Install the patch or update
      ansible.windows.win_shell: >
        msiexec /i "{{ file_exists.path.absolute }}"
      when: file_exists.stat.exists

    - name: Alternative installation command for updates
      ansible.windows.win_shell: >
        Install-Update "{{ file_exists.path.absolute }}"
      when: file_exists.stat.exists and "'Install-Update'" in "msiexec /i"