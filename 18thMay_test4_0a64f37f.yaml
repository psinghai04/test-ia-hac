- name: Install patches and updates on Windows Server 2025
  hosts: windows
  become: yes
  tasks:
    - name: Navigate to the directory where patches and updates are downloaded
      shell: cd C:\path\to\downloads
      args:
        chdir: C:\path\to\downloads

    - name: Install the patches and updates
      shell: msiexec /i <patch_file>
      args:
        stdin: <path\to\patch_file>
      notify:
        - name: Notify if installation fails
          debug:
            msg: "Failed to install patch: <patch_file>"

    - name: Verify installation
      shell: Get-HotFix -Id <patch_id>
      register: patch_status

    - name: Display installation status
      debug:
        msg: "Patch installation status: {{ patch_status.stdout }}"

  handlers:
    - name: Notify if installation fails
      debug:
        msg: "Failed to install patch: <patch_file>"